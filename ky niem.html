<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhập mã để mở khoá</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  * { box-sizing: border-box; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 20%, #3B2A55 0%, #241A38 55%, #14101F 100%);
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    padding: 24px;
  }
  #lockForm { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 360px; width: 100%; }
  #lockInput {
    width: 100%; text-align: center; letter-spacing: .5em; font-size: 20px;
    padding: 14px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: #fff; outline: none;
  }
  #lockInput::placeholder { color: rgba(255,255,255,.35); letter-spacing: .5em; }
  #lockBtn {
    cursor: pointer; font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: #241A38; background: #fff; border: 0; border-radius: 999px; padding: 13px 30px;
    transition: background .2s ease;
  }
  #lockBtn:hover { background: #F4B6C8; }
  @keyframes lockShake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
</style>
</head>
<body>
  <form id="lockForm">
    <p style="margin: 0; font-size: 11px; letter-spacing: .38em; text-transform: uppercase; color: rgba(255,255,255,.55);">Chỉ dành cho hai đứa mình</p>
    <h1 style="margin: 0; font-family: 'Dancing Script', cursive; font-weight: 600; font-size: clamp(26px, 5.4vw, 38px); color: #F4B6C8;">Nhập mã để mở khoá</h1>
    <input id="lockInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••••••" />
    <button id="lockBtn" type="submit">Mở</button>
    <p id="lockError" style="margin: 0; font-size: 12px; color: #F4849F; min-height: 16px; opacity: 0; transition: opacity .2s ease;">Sai mã rồi, thử lại nhé.</p>
  </form>

<script>
(function () {
  var KEY = 'nostalgia_unlocked_v1';
  var CODE = '29092019';
  var DEST = './Home.html';

  var form = document.getElementById('lockForm');
  var input = document.getElementById('lockInput');
  var err = document.getElementById('lockError');

  function goIn() {
    window.location.replace(DEST);
  }

  try {
    if (localStorage.getItem(KEY) === '1') { goIn(); return; }
  } catch (e) {}

  input.focus();
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value.trim() === CODE) {
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
      goIn();
    } else {
      err.style.opacity = '1';
      input.value = '';
      input.focus();
      form.style.animation = 'none';
      requestAnimationFrame(function () { form.style.animation = 'lockShake .4s ease'; });
    }
  });
})();
</script>
</body>
</html>
