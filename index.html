<script>
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// world x positions per progress (piecewise)
const KEYS = [
  [0, 0], [8, 0], [26, 1800], [32, 2400], [48, 4200], [54, 4820],
  [60, 4980], [66, 4980], [78, 5060], [86, 5060], [88, 7300], [97, 8720], [100, 8980]
];
function worldAt(p) {
  for (let i = 1; i < KEYS.length; i++) {
    if (p <= KEYS[i][0]) {
      const [p0, x0] = KEYS[i - 1], [p1, x1] = KEYS[i];
      return lerp(x0, x1, ease(seg(p, p0, p1)));
    }
  }
  return KEYS[KEYS.length - 1][1];
}

class Journey {
  state = { opened: false };

  mount(root) {
    this.p = 0; this.target = 0; this.phase = 0; this.prevX = 0;
    this.el = {};
    this.root = root;
    this.motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    this.reducedMotion = this.motionQuery.matches;
    const onMotionChange = e => { this.reducedMotion = e.matches; this.petalStaticDrawn = false; };
    if (this.motionQuery.addEventListener) this.motionQuery.addEventListener('change', onMotionChange);
    else this.motionQuery.addListener(onMotionChange);
    const r = root;
    const q = id => r.querySelector('#' + id);
    ['cam','sky19','skyhs','skygr','skysg','lfar','lmid','lnear','chars','figA','figB','caps','cap1','cap2','conf','warm','spot','spotcone','spotfloor','map','route','mmark','mpulse','mdest','mdest2','mkm','fgift','y19','y25','y26','lineHS','line26','lineSG','lineEnd','handoff','pet','gate0','flash','ui','cue','gate','trees','crowd','shA','shB','glid','gbow','gbox'].forEach(k => { this.el[k] = q(k); });
    this.stagesA = this.el.figA.querySelectorAll('[data-stage]');
    this.stagesB = this.el.figB.querySelectorAll('[data-stage]');
    this.legs = r.querySelectorAll('[data-part="legf"], [data-part="legb"]');
    this.arms = r.querySelectorAll('[data-part="armf"], [data-part="armb"]');
    this.soft = r.querySelectorAll('[data-part="hair"], [data-part="scarf"], [data-part="aodai"]');
    this.dots = this.el.ui.querySelectorAll('[data-dot]');

    const rl = this.el.route.getTotalLength();
    this.routeLen = rl;
    this.el.route.style.strokeDasharray = rl + ' ' + rl;
    this.el.route.style.strokeDashoffset = rl;
    this.routePt = t => this.el.route.getPointAtLength(t * rl);

    for (let i = 0; i < 34; i++) {
      const d = document.createElement('div');
      const c = ['#C94A6E', '#C9A227', '#7C4DFF'][i % 3];
      d.style.cssText = 'position:absolute;width:8px;height:11px;background:' + c + ';left:' + (26 + Math.random() * 48) + '%;top:' + (Math.random() * 40) + '%;';
      d._x = 26 + Math.random() * 48; d._y = Math.random() * 40; d._v = .5 + Math.random() * .9; d._r = Math.random() * 360;
      this.el.conf.appendChild(d);
    }
    this.confetti = Array.from(this.el.conf.children);

    this.onWheel = e => { e.preventDefault(); this.push(e.deltaY * 0.028); };
    this.onDown = e => { this.ty = (e.touches ? e.touches[0].clientY : e.clientY); };
    this.onMove = e => {
      if (this.ty == null) return;
      const y = (e.touches ? e.touches[0].clientY : e.clientY);
      this.push((this.ty - y) * 0.09); this.ty = y;
      if (e.cancelable) e.preventDefault();
    };
    this.onUp = () => { this.ty = null; };
    this.onKey = e => {
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); this.push(4); }
      if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); this.push(-4); }
    };
    r.addEventListener('wheel', this.onWheel, { passive: false });
    r.addEventListener('touchstart', this.onDown, { passive: true });
    r.addEventListener('touchmove', this.onMove, { passive: false });
    r.addEventListener('touchend', this.onUp);
    r.addEventListener('mousedown', this.onDown);
    r.addEventListener('mousemove', this.onMove);
    r.addEventListener('mouseup', this.onUp);
    window.addEventListener('keydown', this.onKey);

    this.setupPetals();
    this.frame = () => { this.tick(); this.raf = requestAnimationFrame(this.frame); };
    this.frame();
  }

  push(d) { if (this.state.opened) this.target = clamp(this.target + d, 0, 100); }

  open = () => {
    if (this.state.opened) return;
    const e = this.el;
    e.glid.style.transition = 'transform 1s cubic-bezier(.2,.8,.25,1)';
    e.gbow.style.transition = 'transform 1s cubic-bezier(.2,.8,.25,1)';
    e.glid.style.transform = 'translateZ(1px) translateY(-190px) rotate(-14deg)';
    e.gbow.style.transform = 'translate(-50%, 0) translateZ(3px) translateY(-190px) rotate(-14deg)';
    e.gbox.style.animation = 'none';
    e.gbox.style.transition = 'transform 1.5s cubic-bezier(.2,.8,.25,1)';
    e.gbox.style.transform = 'scale(2.6)';
    setTimeout(() => {
      e.flash.style.transition = 'opacity 1.1s ease';
      e.flash.style.opacity = '1';
    }, 700);
    setTimeout(() => {
      e.gate0.style.transition = 'opacity .9s ease';
      e.gate0.style.opacity = '0';
      e.gate0.style.pointerEvents = 'none';
      e.flash.style.transition = 'opacity 1.6s ease';
      e.flash.style.opacity = '0';
      e.ui.style.transition = 'opacity 1.2s ease';
      e.ui.style.opacity = '1';
      this.state.opened = true;
      this.target = 9;
    }, 1700);
  };

  setupPetals() {
    const c = this.el.pet, ctx = c.getContext('2d'), ps = [];
    const pal = ['#FBD9E3', '#F4B6C8', '#E9A8C0', '#FFEFF4', '#E692AE'];
    const size = () => {
      const b = c.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
      c.width = b.width * d; c.height = b.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
      this.pw = b.width; this.ph = b.height;
    };
    size();
    this.onResize = size;
    window.addEventListener('resize', size);
    const mk = s => ({ x: Math.random() * this.pw, y: s ? Math.random() * this.ph : -30 - Math.random() * 100, r: 6 + Math.random() * 8, vy: .4 + Math.random() * .8, dr: .4 + Math.random() * .9, ph: Math.random() * 6.28, sp: .008 + Math.random() * .015, rot: Math.random() * 3, vr: (Math.random() - .5) * .02, fl: Math.random() * 6.28, vf: .015 + Math.random() * .03, a: .55 + Math.random() * .4, col: pal[(Math.random() * 5) | 0] });
    for (let i = 0; i < 26; i++) ps.push(mk(true));
    const loop = () => {
      if (this.petalOn && (!this.reducedMotion || !this.petalStaticDrawn)) {
        ctx.clearRect(0, 0, this.pw, this.ph);
        for (let i = 0; i < ps.length; i++) {
          const p = ps[i];
          if (!this.reducedMotion) {
            p.y += p.vy; p.ph += p.sp; p.x += Math.sin(p.ph) * p.dr; p.rot += p.vr; p.fl += p.vf;
            if (p.y > this.ph + 40) ps[i] = mk(false);
          }
          const sx = Math.max(.18, Math.abs(Math.cos(p.fl)));
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + (this.reducedMotion ? 0 : Math.sin(p.ph) * .35)); ctx.scale(sx, 1);
          ctx.globalAlpha = p.a; ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.moveTo(0, -p.r * .9);
          ctx.bezierCurveTo(p.r * .95, -p.r * .6, p.r * .7, p.r * .75, 0, p.r);
          ctx.bezierCurveTo(-p.r * .7, p.r * .75, -p.r * .95, -p.r * .6, 0, -p.r * .9);
          ctx.fill(); ctx.restore();
        }
        if (this.reducedMotion) this.petalStaticDrawn = true;
      } else if (!this.petalOn) {
        this.petalStaticDrawn = false;
      }
      this.praf = requestAnimationFrame(loop);
    };
    loop();
  }

  tick() {
    if (!this.state.opened) return;
    this.p += (this.target - this.p) * 0.075;
    const p = this.p, e = this.el;

    const wx = worldAt(p);
    const dx = wx - this.prevX;
    this.prevX = wx;

    // camera zoom / lift
    const zoomIn26 = seg(p, 70, 78) * .1;
    const zoomOutMap = seg(p, 78, 84) * .34;
    const zoomEnd = seg(p, 96, 100) * .16;
    const sc = 1 + zoomIn26 - zoomOutMap + zoomEnd;
    e.cam.style.transform = 'scale(' + sc.toFixed(4) + ')';

    const lift = lerp(0, -26, seg(p, 8, 88));
    e.lfar.style.transform = 'translate3d(' + (-wx * .25).toFixed(1) + 'px,' + (lift * .3).toFixed(1) + 'px,0)';
    e.lmid.style.transform = 'translate3d(' + (-wx * .6).toFixed(1) + 'px,' + (lift * .6).toFixed(1) + 'px,0)';
    e.lnear.style.transform = 'translate3d(' + (-wx * 1.15).toFixed(1) + 'px,' + lift.toFixed(1) + 'px,0)';

    // sky
    e.skyhs.style.opacity = seg(p, 26, 34).toFixed(3);
    e.skygr.style.opacity = seg(p, 46, 54).toFixed(3);
    e.skysg.style.opacity = Math.max(seg(p, 86, 89), seg(p, 62, 68) * 0).toFixed(3);
    e.warm.style.opacity = (1 - seg(p, 54, 64)).toFixed(3);

    // character growth + gap
    const grow = lerp(1, 1.34, seg(p, 8, 88));
    const gap = p < 26 ? 70 : p < 48 ? lerp(70, 40, seg(p, 26, 48))
      : p < 60 ? lerp(40, 22, seg(p, 48, 60))
      : p < 66 ? lerp(22, 190, seg(p, 60, 66))
      : p < 74 ? lerp(190, 20, seg(p, 66, 74))
      : lerp(20, 16, seg(p, 74, 90));
    const offA = p > 62 && p < 72 ? lerp(240, 0, seg(p, 63, 71)) : 0;
    e.chars.style.transform = 'scale(' + grow.toFixed(3) + ') translateY(' + (lift * .5).toFixed(1) + 'px)';
    e.figA.style.transform = 'translateX(' + offA.toFixed(1) + 'px)';
    e.figB.style.transform = 'translateX(' + (gap - 70).toFixed(1) + 'px)';
    const charsOut = 1 - Math.max(seg(p, 80, 84), seg(p, 97.5, 99.4));
    e.chars.style.opacity = charsOut.toFixed(3);
    const figAexit = seg(p, 97, 99.4) * 420;
    if (figAexit > 0) e.figA.style.transform = 'translateX(' + (offA + figAexit).toFixed(1) + 'px)';

    // outfit crossfade
    const w = {
      s19: 1 - seg(p, 26, 32),
      shs: seg(p, 26, 32) - seg(p, 48, 54),
      sgr: seg(p, 48, 54) - seg(p, 64, 69),
      s26: seg(p, 64, 69) - seg(p, 84, 88),
      ssg: seg(p, 84, 88)
    };
    for (const g of this.stagesA) g.setAttribute('opacity', clamp(w[g.dataset.stage], 0, 1).toFixed(3));
    for (const g of this.stagesB) g.setAttribute('opacity', clamp(w[g.dataset.stage], 0, 1).toFixed(3));

    // walk cycle driven by camera speed (+ A's own approach in SC07)
    const speed = Math.abs(dx) + Math.abs(p > 62 && p < 72 ? 1.6 : 0);
    this.phase += speed * 0.022;
    const s = Math.sin(this.phase), c2 = Math.cos(this.phase);
    const amp = clamp(speed * 1.4, 0, 1);
    for (const g of this.legs) {
      const back = g.dataset.part === 'legb';
      g.setAttribute('transform', 'rotate(' + ((back ? -s : s) * 17 * amp).toFixed(2) + ' 30 90)');
    }
    for (const g of this.arms) {
      const back = g.dataset.part === 'armb';
      g.setAttribute('transform', 'rotate(' + ((back ? s : -s) * 11 * amp).toFixed(2) + ' 30 48)');
    }
    for (const g of this.soft) {
      g.setAttribute('transform', 'rotate(' + (c2 * 5 * amp).toFixed(2) + ' 30 36)');
    }
    const bob = Math.abs(Math.sin(this.phase * 2)) * 2.4 * amp;
    e.figA.style.bottom = bob.toFixed(1) + 'px';
    e.figB.style.bottom = (Math.abs(Math.sin(this.phase * 2 + (p < 40 ? 1.2 : 0))) * 2.4 * amp).toFixed(1) + 'px';
    e.shA.style.opacity = (0.5 + (1 - bob / 2.4) * 0.5).toFixed(2);

    // bridges
    e.gate.style.opacity = '1';
    e.trees.style.opacity = '1';
    e.crowd.style.opacity = (0.32 * (1 - seg(p, 64, 69))).toFixed(3);

    // graduation
    const ct = seg(p, 56, 64);
    e.caps.style.opacity = (ct > 0 && ct < 1 ? 1 : 0).toFixed(2);
    if (ct > 0 && ct < 1) {
      const h = Math.sin(ct * Math.PI) * 240;
      e.cap1.style.transform = 'translate(-18px,' + (-h).toFixed(1) + 'px) rotate(' + (ct * 420).toFixed(0) + 'deg)';
      e.cap2.style.transform = 'translate(22px,' + (-h * .88).toFixed(1) + 'px) rotate(' + (-ct * 380).toFixed(0) + 'deg)';
    }
    const cf = seg(p, 57, 66) * (1 - seg(p, 64, 69));
    e.conf.style.opacity = cf.toFixed(3);
    if (cf > 0.01) {
      const t = seg(p, 57, 70);
      for (const d of this.confetti) {
        d.style.transform = 'translateY(' + (t * 520 * d._v).toFixed(0) + 'px) rotate(' + (d._r + t * 700 * d._v).toFixed(0) + 'deg) scaleX(' + Math.cos(t * 9 * d._v).toFixed(2) + ')';
      }
    }

    // 20.05.2026 spotlight
    const sp = seg(p, 64, 69) - seg(p, 79, 83);
    e.spot.style.opacity = clamp(sp, 0, 1).toFixed(3);
    e.spotfloor.style.width = lerp(30, 46, seg(p, 71, 76)).toFixed(1) + '%';

    // map
    const mo = seg(p, 79, 83) - seg(p, 87, 90);
    e.map.style.opacity = clamp(mo, 0, 1).toFixed(3);
    const rt = seg(p, 81.5, 86);
    e.route.style.strokeDashoffset = (this.routeLen * (1 - rt)).toFixed(1);
    if (rt > 0) {
      const pt = this.routePt(clamp(rt + .02, 0, 1));
      e.mmark.setAttribute('cx', pt.x.toFixed(1));
      e.mmark.setAttribute('cy', pt.y.toFixed(1));
    }
    e.mmark.setAttribute('opacity', (rt > 0.01 && rt < .99 ? 1 : 0).toFixed(2));
    e.mkm.setAttribute('opacity', seg(p, 83.5, 85).toFixed(2));
    e.mdest.setAttribute('opacity', seg(p, 85, 86).toFixed(2));
    e.mdest2.setAttribute('opacity', seg(p, 85, 86).toFixed(2));
    const mps = 1 + Math.sin(p * 2) * .06;
    e.mpulse.setAttribute('r', (14 * mps).toFixed(1));

    // final gift + handoff
    const fg = seg(p, 93, 96);
    e.fgift.style.opacity = fg.toFixed(3);
    e.fgift.style.transform = 'translateX(-50%) scale(' + lerp(.7, 1.25, seg(p, 93, 99)).toFixed(3) + ')';
    const ho = seg(p, 97.5, 100);
    e.handoff.style.opacity = ho.toFixed(3);
    e.handoff.style.pointerEvents = ho > .9 ? 'auto' : 'none';
    this.petalOn = p > 94;
    e.pet.style.opacity = seg(p, 94, 98).toFixed(3);

    // text beats
    e.y19.style.opacity = (seg(p, 10, 13) * (1 - seg(p, 20, 24))).toFixed(3);
    e.lineHS.style.opacity = (seg(p, 36, 39) * (1 - seg(p, 44, 47))).toFixed(3);
    e.y25.style.opacity = (seg(p, 54, 57) * (1 - seg(p, 62, 65))).toFixed(3);
    e.y26.style.opacity = (seg(p, 69, 72) * (1 - seg(p, 79, 82))).toFixed(3);
    e.line26.style.opacity = (seg(p, 74, 77) * (1 - seg(p, 79, 82))).toFixed(3);
    e.lineSG.style.opacity = (seg(p, 89, 92) * (1 - seg(p, 95, 97))).toFixed(3);
    e.lineEnd.style.opacity = (seg(p, 95, 97) * (1 - seg(p, 99, 100))).toFixed(3);

    // UI
    const stage = p < 26 ? 0 : p < 48 ? 1 : p < 64 ? 2 : p < 79 ? 3 : p < 87 ? 4 : p < 95 ? 5 : 6;
    for (const d of this.dots) {
      const i = +d.dataset.dot;
      d.style.background = i === stage ? '#7C4DFF' : i < stage ? 'rgba(124,77,255,.4)' : 'rgba(120,105,140,.3)';
    }
    e.cue.style.opacity = (1 - seg(p, 12, 20)).toFixed(2);
  }
}

const journey = new Journey();
journey.mount(document.getElementById('app'));
const openTrigger = document.getElementById('openTrigger');
openTrigger.addEventListener('click', journey.open);
openTrigger.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); journey.open(); }
});
document.getElementById('openBtn').addEventListener('click', journey.open);
</script>
</body>
</html>
