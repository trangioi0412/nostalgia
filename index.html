<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Website kỉ niệm ngày yêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Be+Vietnam+Pro:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #14101F; overflow: hidden; overscroll-behavior: none; }
  * { box-sizing: border-box; }
  a { color: #7C4DFF; text-decoration: none; }
  a:hover { color: #5B2FE0; }
  @keyframes pwiggle { 0%,88%,100% { transform: rotate(0deg); } 91% { transform: rotate(-2.5deg); } 95% { transform: rotate(2.5deg); } }
  @keyframes ppulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pshim { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes pbreath { 0%,100% { transform: rotateX(16deg) rotateY(-24deg) scale(1); } 50% { transform: rotateX(16deg) rotateY(-24deg) scale(1.014); } }
  .open-btn:hover { background: #F4B6C8; }
  @media (prefers-reduced-motion: reduce) {
    .deco-anim { animation: none !important; }
  }
</style>
</head>
<body>

<div id="lockScreen" style="position: fixed; inset: 0; z-index: 999999; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 90% at 50% 20%, #3B2A55 0%, #241A38 55%, #14101F 100%); font-family: 'Be Vietnam Pro', system-ui, sans-serif; padding: 24px;">
  <form id="lockForm" style="display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 360px; width: 100%;">
    <p style="margin: 0; font-size: 11px; letter-spacing: .38em; text-transform: uppercase; color: rgba(255,255,255,.55);">Chỉ dành cho hai đứa mình</p>
    <h2 style="margin: 0; font-family: 'Dancing Script', cursive; font-weight: 600; font-size: clamp(24px, 5vw, 34px); color: #F4B6C8;">Nhập mã để mở khoá</h2>
    <input id="lockInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••••••" style="width: 100%; text-align: center; letter-spacing: .5em; font-size: 20px; padding: 14px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; outline: none;" />
    <button type="submit" style="cursor: pointer; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #241A38; background: #fff; border: 0; border-radius: 999px; padding: 13px 30px;">Mở</button>
    <p id="lockError" style="margin: 0; font-size: 12px; color: #F4849F; min-height: 16px; opacity: 0; transition: opacity .2s ease;">Sai mã rồi, thử lại nhé.</p>
  </form>
</div>
<style>
  @keyframes lockShake { 10%,90% { transform: translateX(-1px); } 20%,80% { transform: translateX(2px); } 30%,50%,70% { transform: translateX(-4px); } 40%,60% { transform: translateX(4px); } }
</style>
<script>
(function () {
  var KEY = 'nostalgia_unlocked_v1';
  var CODE = '29092019';
  var lock = document.getElementById('lockScreen');
  if (!lock) return;
  try {
    if (localStorage.getItem(KEY) === '1') { lock.remove(); return; }
  } catch (e) {}
  document.documentElement.style.overflow = 'hidden';
  var form = document.getElementById('lockForm');
  var input = document.getElementById('lockInput');
  var err = document.getElementById('lockError');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value.trim() === CODE) {
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
      document.documentElement.style.overflow = '';
      lock.style.transition = 'opacity .5s ease';
      lock.style.opacity = '0';
      setTimeout(function () { lock.remove(); }, 500);
    } else {
      err.style.opacity = '1';
      input.value = '';
      input.focus();
      form.style.animation = 'none';
      requestAnimationFrame(function () { form.style.animation = 'lockShake .4s ease'; });
    }
  });
})();
</script>

<div id="app" style="position: relative; width: 100%; height: 100vh; min-height: 520px; overflow: hidden; background: #14101F; font-family: 'Be Vietnam Pro', system-ui, sans-serif;">

  <!-- GIFT GATE -->
  <div id="gate0" style="position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; text-align: center; background: radial-gradient(110% 90% at 50% 18%, #3B2A55 0%, #241A38 55%, #1A1228 100%);">
    <div style="display: grid; gap: clamp(20px, 3.5vw, 34px); justify-items: center;">
      <p style="margin: 0; font-size: clamp(10px, 1.4vw, 13px); letter-spacing: .38em; text-transform: uppercase; color: rgba(255,255,255,.6);">Có một món quà cho em</p>
      <div id="openTrigger" class="deco-anim" role="button" tabindex="0" style="cursor: pointer; perspective: 900px; padding: 10px; animation: pwiggle 3.6s ease-in-out infinite;">
        <div id="gbox" class="deco-anim" style="position: relative; width: clamp(150px, 30vw, 210px); height: clamp(120px, 24vw, 168px); transform-style: preserve-3d; animation: pbreath 4s ease-in-out infinite;">
          <div class="deco-anim" style="position: absolute; left: 50%; top: 50%; width: 150%; height: 150%; transform: translate(-50%, -50%) translateZ(-40px); border-radius: 50%; background: radial-gradient(circle, rgba(124,77,255,.45) 0%, rgba(124,77,255,0) 65%); filter: blur(10px); animation: pshim 3s ease-in-out infinite;"></div>
          <div style="position: absolute; inset: 0; border-radius: 8px; background: linear-gradient(145deg, #F4B6C8 0%, #E692AE 55%, #D67C9C 100%); box-shadow: 0 50px 80px -40px rgba(0,0,0,.65), inset 0 0 40px rgba(255,255,255,.25);"></div>
          <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 20%; transform: translateX(-50%); background: linear-gradient(90deg, rgba(124,77,255,.9), rgba(158,120,255,.95));"></div>
          <div style="position: absolute; left: 0; right: 0; top: 46%; height: 18%; background: linear-gradient(180deg, rgba(124,77,255,.9), rgba(158,120,255,.95));"></div>
          <div id="glid" style="position: absolute; left: -4%; right: -4%; top: -14%; height: 30%; transform: translateZ(1px); border-radius: 8px; background: linear-gradient(145deg, #FFFFFF 0%, #FBE3EC 60%, #F2C6D6 100%); box-shadow: 0 18px 30px -18px rgba(0,0,0,.5);"></div>
          <div id="gbow" class="deco-anim" style="position: absolute; left: 50%; top: -22%; width: 30%; height: 30%; transform: translate(-50%, 0) translateZ(3px); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF, #9E78FF 70%, #7C4DFF 100%); box-shadow: 0 12px 24px -10px rgba(0,0,0,.5); animation: ppulse 2.6s ease-in-out infinite;"></div>
        </div>
      </div>
      <button id="openBtn" class="open-btn" style="cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif; font-size: clamp(11px, 1.4vw, 13px); font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: #241A38; background: #FFFFFF; border: 0; border-radius: 999px; padding: 13px 30px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.6);">Mở quà</button>
    </div>
  </div>

  <!-- MEMORY SCENE -->
  <div id="memoryScene" style="position: absolute; inset: 0; z-index: 30; opacity: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: radial-gradient(120% 90% at 50% 0%, #FFF7FA 0%, #FDF0F5 45%, #F7E9F3 100%); transition: opacity 1s ease;">
    <div style="display: grid; gap: 10px; justify-items: center;">
      <p style="margin: 0; font-size: clamp(10px, 1.4vw, 13px); letter-spacing: .38em; text-transform: uppercase; color: #9A7F92;">Những mảnh ghép nhỏ của hai đứa</p>
      <h1 style="margin: 0 0 clamp(80px, 14vw, 160px); font-family: 'Dancing Script', cursive; font-weight: 600; font-size: clamp(24px, 4.4vw, 44px); color: #7C4DFF;">rơi xuống từ ngày đó</h1>
    </div>
    <a id="continueLink" href="./Home.html" style="position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); opacity: 0; transition: opacity .8s ease; padding: 13px 30px; border-radius: 999px; background: #7C4DFF; color: #FFF; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; pointer-events: none;">Ghép lại tấm ảnh</a>
  </div>

  <!-- PUZZLE SCENE -->
  <div id="puzzleScene" style="position: absolute; inset: 0; z-index: 32; opacity: 0; pointer-events: none; display: grid; place-items: center; padding: 24px; text-align: center; background: radial-gradient(120% 90% at 50% 0%, #FFF7FA 0%, #FDF0F5 45%, #F7E9F3 100%); transition: opacity .7s ease;">
    <div style="display: grid; gap: clamp(16px, 3vw, 28px); justify-items: center; width: 100%;">
      <p style="margin: 0; font-size: clamp(10px, 1.4vw, 13px); letter-spacing: .38em; text-transform: uppercase; color: #9A7F92;">Ghép lại một khoảnh khắc</p>
      <div id="puzzleFrame" style="position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 50px -20px rgba(90,60,90,.4);"></div>
      <p id="puzzleHint" style="margin: 0; font-size: 12px; letter-spacing: .1em; color: #B29CAB;">Kéo từng mảnh vào đúng ô trong khung</p>
    </div>
  </div>

  <!-- OPEN FLASH -->
  <div id="flash" style="position: absolute; inset: 0; z-index: 41; opacity: 0; pointer-events: none; background: radial-gradient(48% 56% at 50% 52%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.72) 38%, rgba(196,174,255,.22) 62%, rgba(124,77,255,0) 82%);"></div>
</div>

<script>
(function () {
  var MEMORIES = [
    { date: '29 . 09 . 2019', title: 'Ngày mình bắt đầu' },
    { date: '', title: 'Lần đầu đi chơi cùng nhau' },
    { date: '', title: 'Chuyến đi xa đầu tiên' },
    { date: '', title: 'Một ngày mình không bao giờ quên' },
    { date: 'Hôm nay', title: 'Vẫn đang viết tiếp' }
  ];

  var opened = false;
  var glid = document.getElementById('glid');
  var gbow = document.getElementById('gbow');
  var gbox = document.getElementById('gbox');
  var gate0 = document.getElementById('gate0');
  var flash = document.getElementById('flash');
  var memoryScene = document.getElementById('memoryScene');
  var continueLink = document.getElementById('continueLink');

  function spawnMemories(originX, originY, onDone) {
    var w = 260, h = 170;
    var bandHalf = 320;
    var minX = Math.max(10, originX - bandHalf - w / 2);
    var maxX = Math.min(window.innerWidth - w - 10, originX + bandHalf - w / 2);
    var groundY = Math.min(originY + 210, window.innerHeight - h - 90);
    var cards = [];
    for (var i = 0; i < MEMORIES.length; i++) {
      var m = MEMORIES[i];
      var el = document.createElement('div');
      el.style.cssText = 'position:fixed;left:0;top:0;width:' + w + 'px;height:' + h + 'px;padding:24px 26px;background:#fff;border-radius:14px;box-shadow:0 22px 42px -18px rgba(90,60,90,.42);z-index:45;pointer-events:auto;touch-action:none;cursor:grab;text-align:left;';
      var dateHtml = m.date ? '<p style="margin:0 0 8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#B29CAB;">' + m.date + '</p>' : '';
      el.innerHTML = dateHtml + '<p style="margin:0;font-family:\'Dancing Script\',cursive;font-size:29px;line-height:1.3;color:#33262E;">' + m.title + '</p>';
      document.body.appendChild(el);
      var c = {
        el: el,
        x: originX - w / 2,
        y: originY - h / 2,
        vx: (Math.random() - 0.5) * 90,
        vy: -140 - Math.random() * 80,
        rot: (Math.random() - 0.5) * 40,
        vrot: (Math.random() - 0.5) * 60,
        settled: false,
        dragging: false
      };
      cards.push(c);

      (function (c, el) {
        var startPX, startPY, origX, origY;
        function move(e) {
          c.x = origX + (e.clientX - startPX);
          c.y = origY + (e.clientY - startPY);
        }
        function up(e) {
          c.dragging = false;
          c.vx = 0; c.vy = 0; c.vrot = 0;
          c.settled = true;
          el.style.cursor = 'grab';
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', up);
        }
        el.addEventListener('pointerdown', function (e) {
          el.setPointerCapture(e.pointerId);
          c.dragging = true;
          c.settled = false;
          el.style.cursor = 'grabbing';
          startPX = e.clientX; startPY = e.clientY;
          origX = c.x; origY = c.y;
          el.addEventListener('pointermove', move);
          el.addEventListener('pointerup', up);
        });
      })(c, el);
    }

    var GRAV = 260;
    var last = performance.now();
    var announced = false;
    function step(now) {
      var dt = Math.min((now - last) / 1000, 0.032);
      last = now;
      var allSettled = true;
      for (var i = 0; i < cards.length; i++) {
        var c = cards[i];
        if (c.dragging) { allSettled = false; }
        else if (!c.settled) {
          allSettled = false;
          c.vy += GRAV * dt;
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.rot += c.vrot * dt;
          if (c.x < minX) { c.x = minX; c.vx *= -0.4; }
          if (c.x > maxX) { c.x = maxX; c.vx *= -0.4; }
          if (c.y > groundY - h) {
            c.y = groundY - h;
            c.vy *= -0.12;
            c.vx *= 0.6;
            c.vrot *= 0.5;
            if (Math.abs(c.vy) < 40) { c.vy = 0; c.rot = c.rot * 0.4; c.settled = true; }
          }
        }
        c.el.style.transform = 'translate3d(' + c.x.toFixed(1) + 'px,' + c.y.toFixed(1) + 'px,0) rotate(' + c.rot.toFixed(1) + 'deg)';
      }
      if (!announced && allSettled) { announced = true; if (onDone) onDone(); }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    return cards;
  }

  var PUZZLE_IMAGE = 'photo.jpg';
  var puzzleScene = document.getElementById('puzzleScene');
  var puzzleFrame = document.getElementById('puzzleFrame');
  var puzzleHint = document.getElementById('puzzleHint');
  var puzzleBuilt = false;

  function buildPuzzle() {
    if (puzzleBuilt) return;
    puzzleBuilt = true;
    var GRID = 3;
    var size = Math.max(210, Math.min(window.innerWidth * 0.8, window.innerHeight * 0.5, 420));
    var cell = size / GRID;
    var bg = "url('" + PUZZLE_IMAGE + "'), linear-gradient(135deg,#F4B6C8,#E692AE,#7C4DFF)";
    puzzleFrame.style.width = size + 'px';
    puzzleFrame.style.height = size + 'px';

    var ghost = document.createElement('div');
    ghost.style.cssText = 'position:absolute;inset:0;opacity:.16;background-image:' + bg + ';background-size:cover,cover;background-position:center,center;';
    puzzleFrame.appendChild(ghost);

    var total = GRID * GRID;
    var placedCount = 0;
    var pieces = [];

    for (var row = 0; row < GRID; row++) {
      for (var col = 0; col < GRID; col++) {
        var slot = document.createElement('div');
        slot.style.cssText = 'position:absolute;left:' + (col * cell) + 'px;top:' + (row * cell) + 'px;width:' + cell + 'px;height:' + cell + 'px;border:1px dashed rgba(124,77,255,.35);box-sizing:border-box;';
        puzzleFrame.appendChild(slot);

        var piece = document.createElement('div');
        piece.style.cssText = 'position:fixed;left:0;top:0;width:' + cell + 'px;height:' + cell + 'px;border-radius:4px;box-shadow:0 12px 24px -10px rgba(0,0,0,.42);outline:2px solid #fff;background-image:' + bg + ';background-size:' + size + 'px ' + size + 'px,' + size + 'px ' + size + 'px;background-position:-' + (col * cell) + 'px -' + (row * cell) + 'px,-' + (col * cell) + 'px -' + (row * cell) + 'px;z-index:47;cursor:grab;touch-action:none;pointer-events:auto;';
        document.body.appendChild(piece);
        pieces.push({ el: piece, row: row, col: col, x: 0, y: 0, placed: false });
      }
    }

    function scatter() {
      var frameRect = puzzleFrame.getBoundingClientRect();
      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];
        var x = 16 + Math.random() * Math.max(40, window.innerWidth - cell - 32);
        var y = frameRect.bottom + 24 + Math.random() * Math.max(60, window.innerHeight - frameRect.bottom - cell - 40);
        p.x = x; p.y = y;
        p.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
      }
    }

    pieces.forEach(function (p) {
      var startPX, startPY, origX, origY;
      function move(e) {
        p.x = origX + (e.clientX - startPX);
        p.y = origY + (e.clientY - startPY);
        p.el.style.transform = 'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,0)';
      }
      function up(e) {
        p.el.removeEventListener('pointermove', move);
        p.el.removeEventListener('pointerup', up);
        var frameRect = puzzleFrame.getBoundingClientRect();
        var targetX = frameRect.left + p.col * cell, targetY = frameRect.top + p.row * cell;
        var dist = Math.hypot(p.x - targetX, p.y - targetY);
        if (dist < cell * 0.45) {
          p.x = targetX; p.y = targetY; p.placed = true;
          p.el.style.transition = 'transform .18s ease';
          p.el.style.transform = 'translate3d(' + targetX.toFixed(1) + 'px,' + targetY.toFixed(1) + 'px,0)';
          p.el.style.cursor = 'default';
          p.el.style.zIndex = 44;
          p.el.removeEventListener('pointerdown', down);
          placedCount++;
          if (placedCount === total) {
            puzzleHint.style.opacity = '0';
            setTimeout(goToHome, 600);
          }
        }
      }
      function down(e) {
        if (p.placed) return;
        p.el.setPointerCapture(e.pointerId);
        p.el.style.transition = 'none';
        p.el.style.cursor = 'grabbing';
        p.el.style.zIndex = 48;
        startPX = e.clientX; startPY = e.clientY;
        origX = p.x; origY = p.y;
        p.el.addEventListener('pointermove', move);
        p.el.addEventListener('pointerup', up);
      }
      p.el.addEventListener('pointerdown', down);
    });

    requestAnimationFrame(scatter);
  }

  function openPuzzle(memoryCards) {
    memoryScene.style.opacity = '0';
    continueLink.style.pointerEvents = 'none';
    memoryCards.forEach(function (c) {
      c.el.style.transition = 'opacity .5s ease';
      c.el.style.opacity = '0';
    });
    setTimeout(function () {
      memoryCards.forEach(function (c) { c.el.remove(); });
      puzzleScene.style.opacity = '1';
      puzzleScene.style.pointerEvents = 'auto';
      buildPuzzle();
    }, 550);
  }

  function goToHome() {
    flash.style.transition = 'opacity 1.1s ease';
    flash.style.opacity = '1';
    setTimeout(function () {
      window.location.href = './Home.html';
    }, 1000);
  }

  function open() {
    if (opened) return;
    opened = true;
    var box = gbox.getBoundingClientRect();
    var originX = box.left + box.width / 2, originY = box.top + box.height / 2;
    var memoryCards = [];
    glid.style.transition = 'transform 1s cubic-bezier(.2,.8,.25,1)';
    gbow.style.transition = 'transform 1s cubic-bezier(.2,.8,.25,1)';
    glid.style.transform = 'translateZ(1px) translateY(-190px) rotate(-14deg)';
    gbow.style.transform = 'translate(-50%, 0) translateZ(3px) translateY(-190px) rotate(-14deg)';
    gbox.style.animation = 'none';
    gbox.style.transition = 'transform 1s cubic-bezier(.2,.8,.25,1)';
    gbox.style.transform = 'scale(1.4)';
    setTimeout(function () {
      gate0.style.transition = 'opacity .9s ease';
      gate0.style.opacity = '0';
      gate0.style.pointerEvents = 'none';
      memoryScene.style.opacity = '1';
      memoryCards = spawnMemories(originX, originY, function () {
        continueLink.style.opacity = '1';
        continueLink.style.pointerEvents = 'auto';
      });
    }, 900);
    continueLink.addEventListener('click', function (e) {
      e.preventDefault();
      openPuzzle(memoryCards);
    });
  }

  document.getElementById('openTrigger').addEventListener('click', open);
  document.getElementById('openTrigger').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  document.getElementById('openBtn').addEventListener('click', open);
})();
</script>

</body>
</html>
